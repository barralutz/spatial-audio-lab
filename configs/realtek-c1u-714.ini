[layout]
name=Realtek + front panel + C-1U 7.1.4
speakers=FL,FR,FC,LFE,BL,BR,SL,SR,TFL,TFR,TBL,TBR
outputs=rear,top-front,top-rear
master=rear

[speaker.FL]
azimuth=-30
elevation=0
trim_db=0

[speaker.FR]
azimuth=30
elevation=0
trim_db=0

[speaker.FC]
azimuth=0
elevation=0
trim_db=0

[speaker.LFE]
azimuth=0
elevation=0
trim_db=0

[speaker.BL]
azimuth=-150
elevation=0
trim_db=9

[speaker.BR]
azimuth=150
elevation=0
trim_db=0

[speaker.SL]
azimuth=-90
elevation=0
trim_db=12

[speaker.SR]
azimuth=90
elevation=0
trim_db=0

[speaker.TFL]
azimuth=-39.8
elevation=49.6
trim_db=5.1

[speaker.TFR]
azimuth=40.7
elevation=52.3
trim_db=-3.3

[speaker.TBL]
azimuth=-135
elevation=45
trim_db=6

[speaker.TBR]
azimuth=135
elevation=45
trim_db=5

[output.rear]
endpoint=Altavoces (Realtek(R) Audio)
speakers=FL,FR,FC,LFE,TFL,TFR,SL,SR
delay_ms=0

[output.top-front]
endpoint=Altavoces (USB Audio Device)
speakers=BL,BR
delay_ms=0

[output.top-rear]
endpoint=Realtek HD Audio 2nd output
speakers=TBL,TBR
delay_ms=0
